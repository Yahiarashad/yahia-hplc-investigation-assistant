name: Validate v1.2 Investigation UX

on:
  push:
    branches:
      - v1.2-investigation-ux
    paths:
      - .github/workflows/validate-v12.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2-investigation-ux

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py investigation_report.py

      - name: Generate English and Arabic PDF samples
        run: |
          python - <<'PY'
          from investigation_report import build_investigation_pdf

          samples = [
              [
                  {"role":"user","content":"Pressure exceeded 5000 psi at injection 25; RT moved from 3.44 to 3.80 min."},
                  {"role":"assistant","content":"WHAT_NEXT: Replace only the analytical column with a union and report pressure.\nYOUR_TURN: Report the stabilized pressure.\nEXPLANATION:\nThe next test localizes the restriction without assuming the internal mechanism.\nEVIDENCE_STAGE: HYPOTHESIS\nINVESTIGATION_STATUS: AWAITING_TEST"},
              ],
              [
                  {"role":"user","content":"الضغط تجاوز 5000 psi وتمت إزالة العمود فقط ووصل الضغط إلى 650 psi."},
                  {"role":"assistant","content":"WHAT_NEXT: قيّم العمود طبقًا للإجراء المعتمد.\nYOUR_TURN: اكتب نتيجة الفحص كما لاحظتها.\nEXPLANATION:\nتم تحديد موضع المقاومة داخل مسار العمود التحليلي، لكن السبب الداخلي ما زال غير مؤكد.\nEVIDENCE_STAGE: IMMEDIATE_CAUSE_CONFIRMED\nINVESTIGATION_STATUS: AWAITING_TEST"},
              ],
          ]
          for i, messages in enumerate(samples, 1):
              pdf, report_id, status = build_investigation_pdf(
                  case_id=f"TESTCASE{i:02d}",
                  app_version="v1.2",
                  category="Pressure",
                  messages=messages,
                  status="AWAITING_TEST",
                  evidence_stage="IMMEDIATE_CAUSE_CONFIRMED" if i == 2 else "HYPOTHESIS",
              )
              assert pdf.startswith(b"%PDF")
              assert len(pdf) > 2000
              assert report_id.startswith("HPLC-")
              print(i, report_id, status, len(pdf))
          PY

      - name: Validate response-contract markers
        run: |
          grep -q 'WHAT_NEXT' core_prompt.txt
          grep -q 'YOUR_TURN' core_prompt.txt
          grep -q 'IMMEDIATE_CAUSE_CONFIRMED' core_prompt.txt
          grep -q 'st.rerun()' app.py
