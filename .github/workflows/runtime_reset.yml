name: Streamlit cold runtime reset

on:
  push:
    branches:
      - instrument-lifecycle-standalone

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - name: Restore canonical Streamlit runtime in app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          needle = 'import streamlit as st\nfrom cryptography.fernet import Fernet, InvalidToken\n'
          replacement = '''import streamlit as st\nfrom streamlit.commands.execution_control import rerun as _ilm_native_rerun\nfrom streamlit.commands.page_config import set_page_config as _ilm_native_set_page_config\nfrom cryptography.fernet import Fernet, InvalidToken\n\n# Cold-runtime guard: always restore Streamlit's canonical commands before any\n# application shell or legacy compatibility layer can call them. This avoids\n# wrapper-to-wrapper recursion surviving a Streamlit hot reload.\nst.rerun = _ilm_native_rerun\nst.set_page_config = _ilm_native_set_page_config\ntry:\n    st.markdown = st._main.markdown\n    st.tabs = st._main.tabs\nexcept Exception:\n    pass\n'''
          if '_ilm_native_rerun' not in s:
              if needle not in s:
                  raise SystemExit('app.py import anchor not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
              print('Patched app.py with canonical runtime guard')
          else:
              print('app.py runtime guard already present')

          r = Path('requirements.txt')
          rs = r.read_text(encoding='utf-8')
          marker = '# streamlit-cloud-cold-restart-2026-09-22-v2\n'
          if marker not in rs:
              if not rs.endswith('\n'):
                  rs += '\n'
              rs += marker
              r.write_text(rs, encoding='utf-8')
              print('Touched requirements.txt to force environment rebuild')
          else:
              print('requirements reset marker already present')
          PY
      - name: Commit runtime reset
        run: |
          if git diff --quiet -- app.py requirements.txt; then
            echo "No runtime reset changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt
          git commit -m "Cold-reset Streamlit runtime and eliminate stale rerun wrapper"
          git push origin HEAD:instrument-lifecycle-standalone
