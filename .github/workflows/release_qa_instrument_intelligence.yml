name: Final Instrument Intelligence release QA
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/release_qa_instrument_intelligence.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pypdf
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
      - name: Build and verify official guide
        run: |
          python - <<'PY'
          from io import BytesIO
          from pypdf import PdfReader
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          data = build_product_user_guide_pdf()
          assert data.startswith(b'%PDF'), 'Guide output is not a PDF'
          pages = len(PdfReader(BytesIO(data)).pages)
          print('Official guide pages:', pages)
          assert pages == 19, f'Expected 19 pages, got {pages}'
          PY
      - name: Verify current UX terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          guide = Path('instrument_v03_user_guide.py').read_text(encoding='utf-8')
          core = Path('instrument_supabase_app.py').read_text(encoding='utf-8')
          pdf = Path('instrument_product_guide_pdf.py').read_text(encoding='utf-8')
          for text in ['Instrument 360', '☰ Menu · [Current Page]', 'Availability / Utilization', 'Current Instrument Registry']:
              assert text in guide, f'Missing guide term: {text}'
          assert 'Decision-support signal only' in core
          assert "Open Instrument 360" in pdf
          print('UX terminology checks passed')
          PY
