name: Apply instrument registry export upgrade
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_instrument_registry_export.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python tools/patch_instrument_registry_export.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_v03_user_guide.py instrument_supabase_app.py
          git commit -m "Upgrade instrument registry export and search"
          git push origin HEAD:instrument-lifecycle-standalone
