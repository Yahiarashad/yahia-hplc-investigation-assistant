name: Apply Instrument 360
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_instrument_360.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - name: Fix patch quoting and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_instrument_360.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("new = '''", 'new = """', 1)
          marker = "\n'''\n\nif old not in s:"
          if marker not in s:
              raise SystemExit('new block terminator not found')
          s = s.replace(marker, '\n"""\n\nif old not in s:', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python tools/patch_instrument_360.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_supabase_app.py
          git commit -m "Build mobile-first Instrument 360 view"
          git push origin HEAD:instrument-lifecycle-standalone
