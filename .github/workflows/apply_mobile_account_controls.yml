name: Apply mobile account controls
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_mobile_account_controls.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python tools/patch_mobile_account_controls.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Expose role change and logout in mobile menu"
          git push origin HEAD:instrument-lifecycle-standalone
