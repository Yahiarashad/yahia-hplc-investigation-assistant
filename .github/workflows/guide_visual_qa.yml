name: Visual QA official guide
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/guide_visual_qa.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pymupdf pillow
      - name: Build and render final wrapped guide
        run: |
          mkdir -p guide_qa/pages
          python - <<'PY'
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw
          pdf=build_product_user_guide_pdf()
          Path('guide_qa/Yahia_QC_Instrument_Intelligence_Official_Guide_v1.0.pdf').write_bytes(pdf)
          doc=fitz.open(stream=pdf,filetype='pdf')
          thumbs=[]
          for i,p in enumerate(doc):
              pix=p.get_pixmap(matrix=fitz.Matrix(1.35,1.35),alpha=False)
              fn=Path('guide_qa/pages')/f'page-{i+1:02d}.png'
              pix.save(str(fn))
              im=Image.open(fn).convert('RGB')
              im.thumbnail((280,396))
              canvas=Image.new('RGB',(300,430),'white')
              canvas.paste(im,((300-im.width)//2,20))
              ImageDraw.Draw(canvas).text((12,405),f'Page {i+1}',fill='black')
              thumbs.append(canvas)
          cols=4
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*300,rows*430),(235,235,235))
          for idx,im in enumerate(thumbs):
              sheet.paste(im,((idx%cols)*300,(idx//cols)*430))
          sheet.save('guide_qa/contact-sheet.jpg',quality=90)
          print('Rendered pages:',len(doc))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guide-visual-qa-final
          path: guide_qa
          retention-days: 1
