name: Fix English guide and report runtime

on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - '.github/workflows/fix_english_guide_reports_runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Apply language and report-runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # app.py — keep report engines in isolated module namespaces.
          # The app previously exec()'d both report modules into the shared app
          # globals, so helper names could be overwritten later by the legacy core.
          # ------------------------------------------------------------------
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '_exec_extension("instrument_pdf_reports.py", "_ilm_pdf_module_error")\n_exec_extension("instrument_executive_performance_report.py", "_ilm_exec_report_module_error")\n',
              '# Report engines are imported in their own module namespaces after the core app loads.\n# This prevents helper-name collisions caused by exec(..., globals(), globals()).\n',
              'app extension isolation',
          )

          old_reports = '''# Reports: lifecycle evidence PDF + executive monthly performance intelligence --\ntry:\n    if isinstance(main_tabs, list) and len(main_tabs) >= 1 and _is_signed_in:\n        with main_tabs[0]:\n            st.divider()\n            if callable(globals().get("render_pdf_report_center")):\n                render_pdf_report_center(globals(), ui_lang=_current_language())\n            if callable(globals().get("render_executive_performance_report")):\n                render_executive_performance_report()\nexcept Exception as exc:\n    try:\n        with main_tabs[0]:\n            st.error("Advanced Report Center could not load completely.")\n            st.caption(f"Diagnostic: {type(exc).__name__}")\n    except Exception:\n        pass\n'''
          new_reports = '''# Reports: lifecycle evidence PDF + executive monthly performance intelligence --\n# Keep each report engine isolated so its private helpers cannot be overwritten by\n# the legacy core or another extension loaded into the shared application globals.\ntry:\n    if isinstance(main_tabs, list) and len(main_tabs) >= 1 and _is_signed_in:\n        with main_tabs[0]:\n            st.divider()\n            import instrument_pdf_reports as _ilm_pdf_reports_mod\n            _ilm_pdf_reports_mod._find_arabic_font = _ilm_pdf_font_paths\n            _ilm_report_lang = "en" if _current_language() == "en" else "ar"\n            _ilm_pdf_reports_mod.render_pdf_report_center(globals(), ui_lang=_ilm_report_lang)\nexcept Exception as exc:\n    try:\n        with main_tabs[0]:\n            st.error("PDF Report Center could not load completely.")\n            st.caption(f"Diagnostic: {type(exc).__name__}")\n    except Exception:\n        pass\n\ntry:\n    if isinstance(main_tabs, list) and len(main_tabs) >= 1 and _is_signed_in:\n        with main_tabs[0]:\n            import instrument_executive_performance_report as _ilm_exec_reports_mod\n            _ilm_exec_reports_mod._db_list = globals().get("_db_list")\n            _ilm_exec_reports_mod._font_paths = _ilm_pdf_font_paths\n            _ilm_exec_reports_mod.render_executive_performance_report()\nexcept Exception as exc:\n    try:\n        with main_tabs[0]:\n            st.error("Executive Performance Intelligence could not load completely.")\n            st.caption(f"Diagnostic: {type(exc).__name__}")\n    except Exception:\n        pass\n'''
          s = replace_once(s, old_reports, new_reports, 'reports block')
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # instrument_executive_performance_report.py — bilingual mode maps to
          # Arabic, English mode maps to English. Never pass the literal
          # "bilingual" value into a module that expects ar/en.
          # ------------------------------------------------------------------
          p = Path('instrument_executive_performance_report.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '    lang = _current_language()\n',
              '    lang = "en" if _current_language() == "en" else "ar"\n',
              'executive global language mapping',
          )
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # instrument_camera_capture.py — the guide wrapper used to append an
          # Arabic-only Excel explainer and call feedback with its Arabic default.
          # Replace the wrapper tail with a language-aware version.
          # ------------------------------------------------------------------
          p = Path('instrument_camera_capture.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Extend the practical guide with the Excel-vs-app value proposition and a\n'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('camera guide wrapper marker not found')
          camera_tail = r'''# Extend the practical guide with the Excel-vs-app value proposition and a
# dedicated founding-user feedback step. Keep appended guide content aligned
# with the global interface language.
_existing_user_guide = globals().get("render_v03_user_guide")
if callable(_existing_user_guide):
    from instrument_i18n import current_language as _current_language

    def render_v03_user_guide():
        _existing_user_guide()
        _guide_en = _current_language() == "en"
        excel_title = (
            "⭐ I already have an Excel Tracker — what does this app add?"
            if _guide_en else
            "⭐ عندي Excel Tracker بالفعل — لماذا أستخدم التطبيق؟"
        )
        with st.expander(excel_title, expanded=False):
            if _guide_en:
                st.markdown(
                    """
### Excel stores rows. The application turns instrument history into a decision-ready story.

If you already have a good Excel Tracker, **do not throw it away and do not start from zero**. Use it as a controlled input, then let the application add the decision-support layer.

- **Next Action, not just a row** — Current Stage, Missing Evidence, the Next Controlled Milestone and what needs attention now.
- **One connected lifecycle** — Need → URS → Quotation → PR → PO → Receiving → Installation → IQ/OQ/PQ → Release → First Run → Routine Control → Performance Review → Retirement.
- **Priority Attention Queue** — combines overdue Calibration/PM, OOC, Open Events, receiving delays and incomplete lifecycle evidence by priority.
- **Instrument Memory** — maintenance, calibration, components, failures and investigations stay connected to the same asset history.
- **Investigation Intelligence** — separates Observed / Inferred / Unknown and supports the next evidence action instead of trial-and-error.
- **Camera-assisted entry** — reduces Manufacturer / Model / S/N transcription errors, with user review before saving.
- **Multi-user isolation** — workspace data remains protected through Supabase Row Level Security.

#### Recommended workflow
**Existing Excel Tracker → Import → Lifecycle Intelligence → Priorities / Decisions → Investigation Memory / Reports**

Excel upload is intentionally strict: the importer reads only columns whose headers match the application's controlled field names. Download the template from **Instruments → Import Instrument List** when you need a clean round-trip format.

> **Excel tracks instruments. Yahia QC Instrument Intelligence helps you decide what needs attention next — and why.**
"""
                )
                st.info(
                    "For the best value, keep the Passport, Lifecycle, Calibration/PM, Components and Events current. Decision quality depends on the quality of the recorded evidence."
                )
            else:
                st.markdown(
                    """
### Excel يحفظ البيانات. التطبيق يحوّل تاريخ الجهاز إلى قرار.

لو عندك Excel Tracker جيد، **لا تبدأ من الصفر ولا تتخلص منه**. استخدمه كمدخل للتطبيق، ثم دع التطبيق يضيف طبقة المتابعة والقرار.

- **Next Action وليس مجرد Row** — Current Stage، Missing Evidence، Next Controlled Milestone وما يحتاج متابعة الآن.
- **Lifecycle واحدة مترابطة** — Need → URS → Quotation → PR → PO → Receiving → Installation → IQ/OQ/PQ → Release → First Run → Routine Control → Performance Review → Retirement.
- **Priority Attention Queue** — يجمع Calibration/PM overdue، OOC، Open Events، Receiving delays والمراحل الناقصة حسب الأولوية.
- **Instrument Memory** — الصيانة والمعايرة والمكونات والأعطال والتحقيقات مرتبطة بنفس الجهاز وتاريخه.
- **Investigation Intelligence** — يفصل Observed / Inferred / Unknown ويقترح Next Evidence Action بدل trial-and-error.
- **Camera-assisted entry** — يقلل أخطاء نقل Manufacturer / Model / S/N مع مراجعة المستخدم قبل الحفظ.
- **Multi-user isolation** — كل حساب يرى بياناته فقط عبر Supabase Row Level Security.

#### أفضل Workflow
**Existing Excel Tracker → Import → Lifecycle Intelligence → Priorities / Decisions → Investigation Memory / Reports**

يمكن رفع Excel، لكن التطبيق يتعرف **فقط على الأعمدة التي تحمل نفس اسم الحقل داخل التطبيق**. أي اسم مختلف لا يتم تخمينه أو ربطه تلقائيًا. الأفضل فتح **MY INSTRUMENTS → Instruments → Import Instrument List** ثم تنزيل Template التطبيق من هناك أو توحيد أسماء الأعمدة معه.

> **Excel tracks instruments. Yahia QC Instrument Lifecycle helps you decide what needs attention next — and why.**
"""
                )
                st.info(
                    "لأعلى استفادة: لا تستخدم التطبيق فقط وقت المشكلة. حافظ على Passport وLifecycle وCalibration/PM وComponents وEvents محدثة؛ جودة القرار تعتمد على جودة التاريخ المسجل."
                )

        try:
            from instrument_feedback import render_instrument_feedback
            render_instrument_feedback(compact=True, language="en" if _guide_en else "ar")
        except Exception as exc:
            st.caption(f"Feedback module is temporarily unavailable ({type(exc).__name__}).")
'''
          s = s[:idx] + camera_tail
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # instrument_monthly_performance.py — replace the appended guide tail
          # with an English/Arabic version selected by the global UI language.
          # ------------------------------------------------------------------
          p = Path('instrument_monthly_performance.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Add the calculation + target method to the practical guide without editing the base guide module.\n'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('performance guide wrapper marker not found')
          perf_tail = r'''# Add the calculation + target method to the practical guide without editing the base guide module.
_existing_perf_guide = globals().get("render_v03_user_guide")
if callable(_existing_perf_guide) and not globals().get("_ilm_perf_guide_wrapped"):
    _ilm_perf_guide_wrapped = True
    from instrument_i18n import current_language as _current_language

    def render_v03_user_guide():
        _existing_perf_guide()
        _guide_en = _current_language() == "en"
        title = (
            "📈 Instrument Utilization & Monthly Availability | Calculation method"
            if _guide_en else
            "📈 Instrument Utilization & Monthly Availability | طريقة الحساب"
        )
        with st.expander(title, expanded=False):
            if _guide_en:
                st.markdown(
                    """
### Why do we need both metrics?
**Availability %** measures whether the instrument was ready for use during the time it was planned to be available.  
**Utilization %** measures how much of the actually available time was used productively.

#### 1) Planned Operating Time
`Scheduled Service Hours − Planned Downtime Hours`

Planned Downtime includes known approved stops such as PM, Calibration, Qualification or a planned shutdown.

#### 2) Available Time
`Planned Operating Time − Unplanned Downtime Hours`

Unplanned Downtime includes breakdowns, failures, unexpected repairs or other unscheduled loss of service.

#### 3) Monthly Availability %
`Available Time ÷ Planned Operating Time × 100`

Approved planned downtime is excluded from the Availability denominator so the instrument is not penalized for a controlled planned stop.

#### 4) Instrument Utilization %
`Productive Run Hours ÷ Available Time × 100`

Utilization is not a reliability metric. It describes how intensively the available capacity was used.

#### Practical example
Scheduled = 176 h · Planned Downtime = 8 h · Unplanned Downtime = 12 h · Productive Run = 100 h  
Planned Operating Time = 168 h  
Available Time = 156 h  
Availability = 156 ÷ 168 × 100 = **92.9%**  
Utilization = 100 ÷ 156 × 100 = **64.1%**

#### 5) Performance Targets
The application does not invent one universal target for every instrument. Enter instrument-specific Availability and Utilization targets according to laboratory policy, capacity planning, instrument type or an approved KPI. A target may remain blank when no controlled target exists.

#### 6) Target Gap
`Actual % − Target %`

The gap is displayed in **percentage points (pp)**, not as a relative percentage change.

#### 7) Management Signal
When Availability is below target while Utilization is on or above target, the app raises a **Capacity Risk** signal: demand is strong but reliability/downtime is compressing available capacity. This is a review signal, not a confirmed root cause.

#### Important comparison rule
Do not compare different instruments until the definition of Scheduled Service Hours is consistent. A 24/7 instrument should not be compared directly with an instrument planned for eight hours per day unless the scheduling basis is clear.
"""
                )
                st.warning(
                    "Portfolio Availability and Utilization are weighted by hours, not a simple average of instrument percentages. Targets are operational / management indicators, not GMP release criteria."
                )
            else:
                st.markdown(
                    """
<div style="direction:rtl;text-align:right;line-height:1.95">
<h3>لماذا نحتاج النسبتين؟</h3>
<b>Availability %</b> تقيس قدرة الجهاز على أن يكون جاهزًا للاستخدام خلال الوقت المخطط له، وهي هنا نسبة شهرية.<br>
<b>Utilization %</b> تقيس مقدار الاستخدام الفعلي للجهاز من الوقت الذي كان متاحًا فيه فعلًا.

<h4>1) Planned Operating Time</h4>
<code>Scheduled Service Hours − Planned Downtime Hours</code><br>
الـPlanned Downtime يشمل التوقفات المعروفة مسبقًا مثل PM، Calibration، Qualification أو Planned Shutdown.

<h4>2) Available Time</h4>
<code>Planned Operating Time − Unplanned Downtime Hours</code><br>
الـUnplanned Downtime يشمل Breakdown، Failure، Unexpected Repair أو أي توقف غير مخطط.

<h4>3) Monthly Availability %</h4>
<code>Available Time ÷ Planned Operating Time × 100</code><br>
نستبعد الـApproved Planned Downtime من مقام Availability حتى لا نعاقب الجهاز على توقف مخطط ومعروف.

<h4>4) Instrument Utilization %</h4>
<code>Productive Run Hours ÷ Available Time × 100</code><br>
وبالتالي Utilization لا تقيس Reliability؛ بل تقيس مقدار استغلال الوقت الذي كان الجهاز متاحًا فيه.

<h4>مثال عملي</h4>
Scheduled = 176 h، Planned Downtime = 8 h، Unplanned Downtime = 12 h، Productive Run = 100 h:<br>
Planned Operating Time = 168 h<br>
Available Time = 156 h<br>
Availability = 156 ÷ 168 × 100 = <b>92.9%</b><br>
Utilization = 100 ÷ 156 × 100 = <b>64.1%</b>

<h4>5) Performance Targets</h4>
التطبيق لا يفترض Target ثابتًا لكل الأجهزة. أدخل Target الـAvailability وTarget الـUtilization لكل جهاز حسب سياسة المعمل، خطة السعة، نوع الجهاز أو KPI المعتمد لديك. يمكن ترك الهدف فارغًا إذا لم يكن محددًا.

<h4>6) Target Gap</h4>
<code>Actual % − Target %</code><br>
الفارق يعرض بوحدة <b>percentage points (pp)</b>، وليس نسبة تغير نسبية.

<h4>7) Management Signal</h4>
إذا كانت Availability أقل من الهدف بينما Utilization على/فوق الهدف، فهذه إشارة <b>Capacity Risk</b>: الجهاز مطلوب بقوة لكن Reliability / Downtime تضغط القدرة المتاحة. لا تعتبرها Root Cause؛ اعتبرها إشارة لتحديد أين تحقق أكثر.

<h4>قاعدة مهمة</h4>
لا تقارن أجهزة مختلفة قبل التأكد أن تعريف Scheduled Service Hours موحد. جهاز يعمل 24/7 لا يقارن مباشرة بجهاز مخطط له 8 ساعات يوميًا إلا إذا كانت قواعد الجدولة واضحة.
</div>
""",
                    unsafe_allow_html=True,
                )
                st.warning(
                    "Portfolio Availability وUtilization داخل التطبيق محسوبة Weighted by Hours، وليست Average بسيط لنسب الأجهزة. Targets مؤشرات تشغيلية / إدارية وليست GMP release criteria."
                )
'''
          s = s[:idx] + perf_tail
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # instrument_feedback.py — default to the global UI language, apply RTL
          # only for Arabic/bilingual, and do not inject the RTL product-guide hub
          # into English mode.
          # ------------------------------------------------------------------
          p = Path('instrument_feedback.py')
          s = p.read_text(encoding='utf-8')
          if 'from instrument_i18n import current_language as _current_language\n' not in s:
              s = replace_once(
                  s,
                  'import streamlit as st\n',
                  'import streamlit as st\nfrom instrument_i18n import current_language as _current_language\n',
                  'feedback i18n import',
              )
          s = replace_once(
              s,
              'def render_instrument_feedback(*, compact: bool = True, language: str = "ar") -> None:\n    ar = language == "ar"\n    _apply_guide_rtl_css()\n',
              'def render_instrument_feedback(*, compact: bool = True, language: str | None = None) -> None:\n    resolved_language = language or ("en" if _current_language() == "en" else "ar")\n    ar = resolved_language == "ar"\n    if ar:\n        _apply_guide_rtl_css()\n',
              'feedback language resolution',
          )
          old_hub = '''    # Premium product/user/management guide. It is generated without customer\n    # instrument records, so users can safely download and share the brochure.\n    try:\n        from instrument_product_guide_rtl import render_product_guide_hub\n        render_product_guide_hub()\n    except Exception as exc:\n        st.caption(f"Premium Product Guide is temporarily unavailable ({type(exc).__name__}).")\n'''
          new_hub = '''    # The current premium brochure hub is RTL. Keep it out of English mode so an\n    # English interface never re-introduces Arabic-only guide content.\n    if ar:\n        try:\n            from instrument_product_guide_rtl import render_product_guide_hub\n            render_product_guide_hub()\n        except Exception as exc:\n            st.caption(f"Premium Product Guide is temporarily unavailable ({type(exc).__name__}).")\n'''
          s = replace_once(s, old_hub, new_hub, 'feedback premium hub gating')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          python -m py_compile app.py instrument_camera_capture.py instrument_monthly_performance.py instrument_feedback.py instrument_executive_performance_report.py instrument_pdf_reports.py instrument_v03_user_guide.py instrument_i18n.py

      - name: English residue assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          camera = Path('instrument_camera_capture.py').read_text(encoding='utf-8')
          perf = Path('instrument_monthly_performance.py').read_text(encoding='utf-8')
          feedback = Path('instrument_feedback.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          assert 'language="en" if _guide_en else "ar"' in camera
          assert 'Calculation method' in perf
          assert 'if ar:\n        _apply_guide_rtl_css()' in feedback
          assert 'import instrument_pdf_reports as _ilm_pdf_reports_mod' in app
          assert 'import instrument_executive_performance_report as _ilm_exec_reports_mod' in app
          print('English-mode guide/report assertions passed')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/fix_english_guide_reports_runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py instrument_camera_capture.py instrument_monthly_performance.py instrument_feedback.py instrument_executive_performance_report.py .github/workflows/fix_english_guide_reports_runtime.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix English guide residue and isolate report engines'
          git push origin HEAD:instrument-lifecycle-standalone
