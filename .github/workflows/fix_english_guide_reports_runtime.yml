name: Fix English guide and report runtime

on:
  push:
    branches:
      - instrument-lifecycle-standalone
    paths:
      - .github/workflows/fix_english_guide_reports_runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Apply patch helper
        run: python tools/fix_english_guide_reports_runtime.py

      - name: Syntax checks
        run: python -m py_compile app.py instrument_camera_capture.py instrument_monthly_performance.py instrument_feedback.py instrument_executive_performance_report.py instrument_pdf_reports.py instrument_v03_user_guide.py instrument_i18n.py

      - name: Commit fixes and clean temporary helpers
        run: |
          rm -f .github/workflows/fix_english_guide_reports_runtime.yml
          rm -f tools/fix_english_guide_reports_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py instrument_camera_capture.py instrument_monthly_performance.py instrument_feedback.py instrument_executive_performance_report.py .github/workflows/fix_english_guide_reports_runtime.yml tools/fix_english_guide_reports_runtime.py
          git commit -m 'Fix English guide residue and isolate report engines'
          git push origin HEAD:instrument-lifecycle-standalone
