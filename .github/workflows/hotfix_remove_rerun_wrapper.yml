name: Hotfix remove rerun wrapper

on:
  push:
    branches:
      - instrument-lifecycle-standalone

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - name: Remove recursive rerun monkeypatch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''_real_rerun = st.rerun\n\n\ndef _cookie_aware_rerun(*args, **kwargs):\n    _write_auth_cookie()\n    return _real_rerun(*args, **kwargs)\n\n\nst.rerun = _cookie_aware_rerun\n'''
          new = '''# Keep Streamlit's native rerun untouched.\n# Persisted auth is written at stable auth boundaries and again after the core run.\n# Monkeypatching st.rerun across Streamlit reruns can create wrapper-to-wrapper recursion.\n'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Patched app.py')
          else:
              print('Rerun wrapper already absent; no app.py change required.')
          PY
      - name: Commit hotfix if needed
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Hotfix: remove recursive Streamlit rerun wrapper"
          git push origin HEAD:instrument-lifecycle-standalone
