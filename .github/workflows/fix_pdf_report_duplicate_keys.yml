name: Fix PDF report duplicate keys

on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - '.github/workflows/fix_pdf_report_duplicate_keys.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Make PDF Report Center widget keys collision-proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('instrument_pdf_reports.py')
          s = p.read_text(encoding='utf-8')
          old = '''_ILM_PDF_REPORT_INSTANCE = 0\n\n\ndef render_pdf_report_center(context: dict, ui_lang: str = "ar") -> None:\n    global _ILM_PDF_REPORT_INSTANCE\n    _ILM_PDF_REPORT_INSTANCE += 1\n    _key = lambda name: f"ilm_pdf_report_{name}_{_ILM_PDF_REPORT_INSTANCE}"\n'''
          new = '''def render_pdf_report_center(context: dict, ui_lang: str = "ar") -> None:\n    # This renderer can appear in both Guide and Reports during the same Streamlit\n    # script pass because hidden workspaces are still executed. Use a per-render\n    # token so explicit widget keys cannot collide even if this module is imported\n    # through more than one execution path.\n    import uuid as _uuid\n    _instance_token = _uuid.uuid4().hex[:12]\n    _key = lambda name: f"ilm_pdf_report_{name}_{_instance_token}"\n'''
          if old not in s:
              raise SystemExit('PDF report instance-key anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile instrument_pdf_reports.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix_pdf_report_duplicate_keys.yml
          git add instrument_pdf_reports.py
          git commit -m "Fix duplicate PDF Report Center widget keys"
          git push origin HEAD:instrument-lifecycle-standalone
