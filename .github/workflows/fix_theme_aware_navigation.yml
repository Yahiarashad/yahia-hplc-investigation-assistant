name: Fix theme-aware navigation
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - .github/workflows/fix_theme_aware_navigation.yml
      - tools/fix_theme_aware_navigation.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python tools/fix_theme_aware_navigation.py
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Make navigation readable in light and dark themes"
          git push origin HEAD:instrument-lifecycle-standalone
