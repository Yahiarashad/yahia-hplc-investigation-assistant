name: Apply persistent mobile role navigation patch
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_mobile_role_route_persistence.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python scripts/patch_mobile_role_route_persistence.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Persist UX role across mobile navigation"
          git push origin HEAD:instrument-lifecycle-standalone
