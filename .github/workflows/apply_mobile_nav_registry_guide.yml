name: Apply mobile navigation registry and guide patch
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_mobile_nav_registry_guide.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python scripts/patch_mobile_nav_registry_guide.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py instrument_v03_user_guide.py instrument_supabase_app.py instrument_camera_capture.py
          git commit -m "Fix mobile navigation and move instrument import into registry"
          git push origin HEAD:instrument-lifecycle-standalone
