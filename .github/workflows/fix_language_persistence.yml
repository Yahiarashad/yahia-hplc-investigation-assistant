name: Fix language persistence

on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - '.github/workflows/fix_language_persistence.yml'

permissions:
  contents: write

jobs:
  fix-language-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Patch route links to carry language
        shell: bash
        run: >-
          python -c 'from pathlib import Path; p=Path("app.py"); s=p.read_text(encoding="utf-8"); old="    params = {\"route\": _ROUTE_SLUGS.get(route_item, \"dashboard\")}\n"; new="    params = {\"route\": _ROUTE_SLUGS.get(route_item, \"dashboard\"), \"lang\": _current_language()}\n"; assert old in s or "\"lang\": _current_language()" in s, "route params insertion point not found"; p.write_text(s if old not in s else s.replace(old,new,1), encoding="utf-8")'

      - name: Syntax and persistence checks
        shell: bash
        run: |
          python -m py_compile app.py instrument_i18n.py instrument_supabase_app.py
          grep -F '"lang": _current_language()' app.py
          grep -F 'st.query_params["lang"] = selected' instrument_i18n.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix_language_persistence.yml
          git add app.py
          git commit -m "Persist interface language across navigation"
          git push origin HEAD:instrument-lifecycle-standalone
