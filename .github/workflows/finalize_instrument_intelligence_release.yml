name: Finalize Instrument Intelligence release UX and guides
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - .github/workflows/finalize_instrument_intelligence_release.yml
      - tools/finalize_instrument_intelligence_release.py
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python tools/finalize_instrument_intelligence_release.py
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
          git commit -m "Finalize current Instrument Intelligence UX and official guide"
          git push origin HEAD:instrument-lifecycle-standalone
