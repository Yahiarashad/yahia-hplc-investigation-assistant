name: Finalize guide workflows and typography
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - .github/workflows/finalize_guide_workflows_typography.yml
      - tools/finalize_guide_workflows_typography.py
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pypdf
      - run: python tools/finalize_guide_workflows_typography.py
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
      - name: Build and verify guide
        run: |
          python - <<'PY'
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          from pypdf import PdfReader
          from io import BytesIO
          data = build_product_user_guide_pdf()
          pages = len(PdfReader(BytesIO(data)).pages)
          assert 18 <= pages <= 24, pages
          assert len(data) > 30000, len(data)
          print('PDF pages:', pages, 'bytes:', len(data))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_v03_user_guide.py instrument_product_guide_pdf.py
          git commit -m "Add practical workflows and polish guide typography"
          git push origin HEAD:instrument-lifecycle-standalone
