name: Finalize guide workflows and typography v2
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/finalize_guide_workflows_typography_v2.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pypdf
      - name: Adapt patch to already-current navigation copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('tools/finalize_guide_workflows_typography.py')
          s=path.read_text(encoding='utf-8')
          pat=r"# Role-aware navigation section: explicitly document desktop/mobile routes\.\nrole_anchor = .*?p = p\.replace\(role_anchor, role_new, 1\)\n"
          s2,n=re.subn(pat,"# Navigation wording is already current in the official PDF; no replacement required.\n",s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Could not adapt role navigation block: {n}')
          path.write_text(s2,encoding='utf-8')
          PY
      - run: python tools/finalize_guide_workflows_typography.py
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py
      - name: Build and verify official guide
        run: |
          python - <<'PY'
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          from pypdf import PdfReader
          from io import BytesIO
          data=build_product_user_guide_pdf()
          pages=len(PdfReader(BytesIO(data)).pages)
          assert 18 <= pages <= 24, pages
          assert len(data) > 30000, len(data)
          print('PDF pages:',pages,'bytes:',len(data))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_v03_user_guide.py instrument_product_guide_pdf.py
          git commit -m "Add practical workflows and polish guide typography"
          git push origin HEAD:instrument-lifecycle-standalone
