name: Bootstrap current app shell from legacy entrypoint

on:
  push:
    branches:
      - instrument-lifecycle-standalone
    paths:
      - .github/workflows/bootstrap_shell.yml
      - tools/patch_legacy_entrypoint.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Patch legacy Streamlit entrypoint
        run: python tools/patch_legacy_entrypoint.py

      - name: Commit compatibility bootstrap
        shell: bash
        run: |
          if git diff --quiet -- instrument_supabase_app.py; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_supabase_app.py
          git commit -m "Route legacy Streamlit entrypoint through current app shell"
          git push origin HEAD:instrument-lifecycle-standalone
