name: Fix role onboarding dialog close
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/fix_role_dialog_close.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - name: Patch onboarding dialog to full-app rerun
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''        st.button(\n            "Enter my workspace →",\n            type="primary",\n            use_container_width=True,\n            key="ilm_role_onboarding_go",\n            on_click=_ilm_complete_role_onboarding,\n        )\n'''
          new = '''        if st.button(\n            "Enter my workspace →",\n            type="primary",\n            use_container_width=True,\n            key="ilm_role_onboarding_go",\n        ):\n            _ilm_complete_role_onboarding()\n            # st.dialog behaves like a fragment: widget interaction reruns only\n            # the dialog unless we explicitly request a full-app rerun.\n            # Full rerun re-evaluates the outer condition and removes the modal.\n            st.rerun()\n'''
          if old not in s:
              raise SystemExit('onboarding button anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Close role onboarding dialog after workspace entry"
          git push origin HEAD:instrument-lifecycle-standalone
