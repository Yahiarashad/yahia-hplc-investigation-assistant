name: Patch legacy guide entrypoint

on:
  push:
    branches:
      - instrument-lifecycle-standalone

permissions:
  contents: write

jobs:
  patch-guide:
    if: "${{ !contains(github.event.head_commit.message, '[guide-core-patched]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
      - name: Inject premium guide into legacy Guide tab
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('instrument_supabase_app.py')
          text = path.read_text(encoding='utf-8')
          marker = '# PREMIUM_PRODUCT_GUIDE_BRIDGE'
          if marker in text:
              print('Guide bridge already present.')
              raise SystemExit(0)
          needle = 'with tabs[5]:\n    st.header("How to Use | دليل الاستخدام")'
          if needle not in text:
              raise SystemExit('Legacy Guide anchor was not found; refusing blind edit.')
          replacement = '''with tabs[5]:
    st.header("How to Use | دليل الاستخدام")
    # PREMIUM_PRODUCT_GUIDE_BRIDGE
    # Keep the premium product/user/management guide reachable even when this
    # legacy module is deployed directly as the Streamlit entrypoint.
    try:
        from instrument_product_guide import render_product_guide_hub
        render_product_guide_hub()
    except Exception as exc:
        st.caption(f"Premium Product Guide is temporarily unavailable ({type(exc).__name__}).")'''
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          print('Premium guide bridge injected.')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- instrument_supabase_app.py; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_supabase_app.py
          git commit -m "[guide-core-patched] Expose premium PDF guide in legacy entrypoint"
          git push origin HEAD:instrument-lifecycle-standalone
