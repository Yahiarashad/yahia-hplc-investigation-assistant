name: Apply mobile navigation patch
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/apply_mobile_nav_patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python scripts/patch_mobile_nav_and_guide.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py instrument_product_guide_pdf.py
          git commit -m "Fix mobile navigation focus and merge official guide"
          git push origin HEAD:instrument-lifecycle-standalone
