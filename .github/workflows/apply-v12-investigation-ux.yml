name: Apply v1.2 Investigation UX Patch

on:
  push:
    branches:
      - v1.2-investigation-ux
    paths:
      - .github/workflows/apply-v12-investigation-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1.2-investigation-ux

      - name: Apply deterministic patch
        run: python scripts/apply_v12_patch.py

      - name: Validate Python syntax
        run: python -m py_compile app.py investigation_report.py

      - name: Validate v1.2 markers
        run: |
          grep -q 'APP_VERSION = "v1.2"' app.py
          grep -q 'EVIDENCE_STAGE' app.py
          grep -q 'Download Investigation Report' app.py
          grep -q 'V1.2 UI RESPONSE CONTRACT' core_prompt.txt
          grep -q 'reportlab' requirements.txt

      - name: Commit patched application
        run: |
          git config user.name "Yahia QC v1.2 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py core_prompt.txt requirements.txt
          git commit -m "Implement v1.2 investigation UX and PDF reporting"
          git push origin HEAD:v1.2-investigation-ux
