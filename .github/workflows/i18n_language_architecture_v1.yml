name: Apply i18n language architecture v1

on:
  push:
    branches:
      - instrument-lifecycle-standalone
    paths:
      - .github/workflows/i18n_language_architecture_v1.yml

permissions:
  contents: write

jobs:
  apply-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Add language architecture and English Instrument 360 pilot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')
          app_path = repo / 'app.py'
          core_path = repo / 'instrument_supabase_app.py'
          i18n_path = repo / 'instrument_i18n.py'

          i18n_path.write_text('''# Yahia QC Instrument Intelligence — UI language architecture v1
          # Internal route IDs, database values and evidence records remain unchanged.
          # Localization is presentation-only so the same data/logic serves every language.

          from __future__ import annotations

          import streamlit as st

          LANG_BILINGUAL = "bilingual"
          LANG_ENGLISH = "en"
          LANGUAGE_OPTIONS = (LANG_BILINGUAL, LANG_ENGLISH)
          LANGUAGE_LABELS = {
              LANG_BILINGUAL: "العربية + English",
              LANG_ENGLISH: "English",
          }


          def current_language() -> str:
              value = str(st.session_state.get("ilm_language") or LANG_BILINGUAL)
              return value if value in LANGUAGE_OPTIONS else LANG_BILINGUAL


          def is_english() -> bool:
              return current_language() == LANG_ENGLISH


          def ui_text(english: str, bilingual: str | None = None) -> str:
              """Return localized presentation text without changing stored data or logic."""
              if is_english():
                  return english
              return bilingual if bilingual is not None else english


          def render_language_selector(*, key: str = "global") -> str:
              current = current_language()
              selected = st.selectbox(
                  "🌐 Interface language",
                  options=list(LANGUAGE_OPTIONS),
                  index=list(LANGUAGE_OPTIONS).index(current),
                  format_func=lambda value: LANGUAGE_LABELS.get(value, value),
                  key=f"ilm_language_selector_{key}",
                  help="Changes interface wording only. Instrument data, evidence, permissions and calculations are unchanged.",
              )
              st.session_state.ilm_language = selected
              return selected
          ''', encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {label}')
              return text.replace(old, new, 1)

          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              'from cryptography.fernet import Fernet, InvalidToken\n',
              'from cryptography.fernet import Fernet, InvalidToken\nfrom instrument_i18n import current_language as _current_language, ui_text as _ui_text, render_language_selector as _render_language_selector\n',
              'app i18n import',
          )
          app = replace_once(
              app,
              'if _signed_in_shell and st.session_state.get("ilm_user_role"):\n    st.markdown(\'<div id="ilm-top" style="height:0;overflow:hidden"></div>\', unsafe_allow_html=True)\n    with st.sidebar:\n',
              'if _signed_in_shell and st.session_state.get("ilm_user_role"):\n    st.markdown(\'<div id="ilm-top" style="height:0;overflow:hidden"></div>\', unsafe_allow_html=True)\n    _lang_left, _lang_right = st.columns([3.2, 1])\n    with _lang_right:\n        _render_language_selector(key="global")\n    with st.sidebar:\n',
              'global language selector',
          )
          app_path.write_text(app, encoding='utf-8')

          core = core_path.read_text(encoding='utf-8')
          core = replace_once(
              core,
              'import pandas as pd\nimport streamlit as st\n',
              'import pandas as pd\nimport streamlit as st\nfrom instrument_i18n import current_language as _current_language, ui_text as _ui_text\n',
              'core i18n import',
          )

          replacements = [
              ('with st.expander("➕ Add one instrument | إضافة جهاز", expanded=(len(instruments)==0)):',
               'with st.expander(_ui_text("➕ Add one instrument", "➕ Add one instrument | إضافة جهاز"), expanded=(len(instruments)==0)):',
               'add instrument label'),
              ('with st.expander("📥 إضافة / استيراد قائمة أجهزة | Import Instrument List", expanded=False):',
               'with st.expander(_ui_text("📥 Import Instrument List", "📥 إضافة / استيراد قائمة أجهزة | Import Instrument List"), expanded=False):',
               'import list label'),
              ('with st.expander("📋 سجل الأجهزة الحالي | Current Instrument Registry", expanded=False):',
               'with st.expander(_ui_text("📋 Current Instrument Registry", "📋 سجل الأجهزة الحالي | Current Instrument Registry"), expanded=False):',
               'registry label'),
              ('with st.expander("🪪 IDENTITY | الهوية", expanded=True):',
               'with st.expander(_ui_text("🪪 IDENTITY", "🪪 IDENTITY | الهوية"), expanded=True):',
               'identity label'),
              ('with st.expander("↻ LIFECYCLE | دورة حياة الجهاز", expanded=False):',
               'with st.expander(_ui_text("↻ LIFECYCLE", "↻ LIFECYCLE | دورة حياة الجهاز"), expanded=False):',
               'lifecycle label'),
              ('with st.expander("◎ CONTROL | حالة التحكم الحالية", expanded=False):',
               'with st.expander(_ui_text("◎ CONTROL", "◎ CONTROL | حالة التحكم الحالية"), expanded=False):',
               'control label'),
              ('with st.expander("⚠ EVENTS | الأعطال والإشارات", expanded=False):',
               'with st.expander(_ui_text("⚠ EVENTS", "⚠ EVENTS | الأعطال والإشارات"), expanded=False):',
               'events label'),
          ]
          for old, new, label in replacements:
              core = replace_once(core, old, new, label)

          pilot_anchor = 'selected_code=st.selectbox("Open Instrument 360",codes,index=default_index,key="passport_selected")\n'
          pilot_replacement = pilot_anchor + '        st.caption(_ui_text("🌐 English interface · Instrument 360 pilot", "🌐 Bilingual interface · العربية + English"))\n'
          core = replace_once(core, pilot_anchor, pilot_replacement, 'Instrument 360 language state')

          core_path.write_text(core, encoding='utf-8')
          PY

      - name: Syntax and architecture checks
        shell: bash
        run: |
          python -m py_compile app.py instrument_supabase_app.py instrument_i18n.py instrument_v03_user_guide.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          core = Path('instrument_supabase_app.py').read_text(encoding='utf-8')
          assert '_render_language_selector(key="global")' in app
          assert '_ui_text("🪪 IDENTITY", "🪪 IDENTITY | الهوية")' in core
          assert '_ui_text("⚠ EVENTS", "⚠ EVENTS | الأعطال والإشارات")' in core
          print('i18n v1 checks passed')
          PY

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/i18n_language_architecture_v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py instrument_supabase_app.py instrument_i18n.py .github/workflows/i18n_language_architecture_v1.yml
          git commit -m "Add bilingual-English language architecture v1"
          git push origin HEAD:instrument-lifecycle-standalone
