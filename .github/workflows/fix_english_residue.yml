name: Fix English UI residue

on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - '.github/workflows/fix_english_residue.yml'

permissions:
  contents: write

jobs:
  fix-english-residue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Localize remaining bilingual Instruments label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('instrument_supabase_app.py')
          text = p.read_text(encoding='utf-8')
          old = 'with st.expander("Why this application matters | لماذا هذا التطبيق مهم؟", expanded=(len(instruments) == 0)):'
          new = 'with st.expander(_ui_text("Why this application matters", "Why this application matters | لماذا هذا التطبيق مهم؟"), expanded=(len(instruments) == 0)):'
          if old not in text:
              raise SystemExit('Target bilingual label not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax check
        shell: bash
        run: |
          python -m py_compile instrument_supabase_app.py instrument_i18n.py app.py
          grep -F '_ui_text("Why this application matters"' instrument_supabase_app.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix_english_residue.yml
          git add instrument_supabase_app.py
          git commit -m "Remove Arabic residue from English Instruments view"
          git push origin HEAD:instrument-lifecycle-standalone
