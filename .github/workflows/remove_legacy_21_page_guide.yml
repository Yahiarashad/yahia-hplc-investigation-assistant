name: Remove legacy 21-page guide
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths: [.github/workflows/remove_legacy_21_page_guide.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - run: python scripts/remove_legacy_21_page_guide.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_product_guide.py
          git commit -m "Retire legacy 21-page guide UI"
          git push origin HEAD:instrument-lifecycle-standalone
