name: Embed guide visuals
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - .github/workflows/embed_guide_visuals.yml
      - tools/embed_guide_visuals.py
      - instrument_guide_visuals.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pypdf pymupdf pillow
      - name: Make embedded screenshots padding tolerant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('instrument_guide_visuals.py')
          s=p.read_text(encoding='utf-8')
          old='    return base64.b64decode(value) if value else b""\n'
          new='    if not value:\n        return b""\n    value = value + ("=" * (-len(value) % 4))\n    return base64.b64decode(value)\n'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: python tools/embed_guide_visuals.py
      - name: Keep only verified screenshot asset
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('instrument_v03_user_guide.py')
          s=g.read_text(encoding='utf-8')
          block='''            _shot_attention = guide_visual_bytes("instrument_360_attention")\n            if _shot_attention:\n                st.image(_shot_attention, caption="Management Attention: إشارة اتساق Evidence تحتاج مراجعة، وليست حكم Compliance أو Root Cause.", width=260)\n'''
          s=s.replace(block,'')
          g.write_text(s,encoding='utf-8')

          p=Path('instrument_product_guide_pdf.py')
          t=p.read_text(encoding='utf-8')
          block2="    story.append(Spacer(1,4*mm)); story.append(_guide_screenshot('instrument_360_attention'))\n    story.append(Paragraph('Actual app view - explainable Health Score and Management Attention signal. Decision-support only.', styles['small']))\n"
          t=t.replace(block2,'')
          p.write_text(t,encoding='utf-8')
          PY
      - run: python -m py_compile app.py instrument_supabase_app.py instrument_v03_user_guide.py instrument_product_guide_pdf.py instrument_guide_visuals.py
      - name: Build and visual QA
        run: |
          mkdir -p guide_visual_embed_qa/pages
          python - <<'PY'
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          from pathlib import Path
          from pypdf import PdfReader
          from io import BytesIO
          import fitz
          from PIL import Image, ImageDraw
          data=build_product_user_guide_pdf()
          pages=len(PdfReader(BytesIO(data)).pages)
          print('PDF pages:',pages,'bytes:',len(data))
          assert 19 <= pages <= 23, pages
          Path('guide_visual_embed_qa/Yahia_QC_Instrument_Intelligence_Official_Guide_v1.0.pdf').write_bytes(data)
          doc=fitz.open(stream=data,filetype='pdf')
          thumbs=[]
          for i,p in enumerate(doc):
              pix=p.get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False)
              fn=Path('guide_visual_embed_qa/pages')/f'page-{i+1:02d}.png'
              pix.save(str(fn))
              im=Image.open(fn).convert('RGB')
              im.thumbnail((280,396))
              canvas=Image.new('RGB',(300,430),'white')
              canvas.paste(im,((300-im.width)//2,20))
              ImageDraw.Draw(canvas).text((12,405),f'Page {i+1}',fill='black')
              thumbs.append(canvas)
          cols=4; rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*300,rows*430),(235,235,235))
          for idx,im in enumerate(thumbs): sheet.paste(im,((idx%cols)*300,(idx//cols)*430))
          sheet.save('guide_visual_embed_qa/contact-sheet.jpg',quality=90)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Yahiarashad@users.noreply.github.com"
          git add instrument_v03_user_guide.py instrument_product_guide_pdf.py instrument_guide_visuals.py
          git commit -m "Embed verified app screenshot in guide workflows"
          git push origin HEAD:instrument-lifecycle-standalone
      - uses: actions/upload-artifact@v4
        with:
          name: guide-visual-embed-qa
          path: guide_visual_embed_qa
          retention-days: 1
