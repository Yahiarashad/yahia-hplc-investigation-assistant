name: Fix guide PDF table wrapping
on:
  push:
    branches: [instrument-lifecycle-standalone]
    paths:
      - .github/workflows/fix_guide_table_wrap.yml
      - tools/fix_guide_table_wrap.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab arabic-reshaper python-bidi pypdf
      - run: python tools/fix_guide_table_wrap.py
      - run: python -m py_compile instrument_product_guide_pdf.py instrument_v03_user_guide.py app.py instrument_supabase_app.py
      - name: Build and verify
        run: |
          python - <<'PY'
          from instrument_product_guide_pdf import build_product_user_guide_pdf
          from pypdf import PdfReader
          from io import BytesIO
          data=build_product_user_guide_pdf()
          pages=len(PdfReader(BytesIO(data)).pages)
          assert 18 <= pages <= 24, pages
          print('PDF pages:',pages,'bytes:',len(data))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instrument_product_guide_pdf.py
          git commit -m "Wrap guide PDF tables for readable workflows"
          git push origin HEAD:instrument-lifecycle-standalone
