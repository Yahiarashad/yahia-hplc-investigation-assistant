name: Finalize English mode

on:
  push:
    branches:
      - instrument-lifecycle-standalone
    paths:
      - .github/workflows/finalize_english_mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrument-lifecycle-standalone
          fetch-depth: 0

      - name: Apply English-mode patch
        run: python tools/finalize_english_mode.py

      - name: Syntax checks
        run: python -m py_compile app.py instrument_pdf_reports.py instrument_executive_performance_report.py instrument_v03_user_guide.py instrument_i18n.py

      - name: Commit patch and clean helpers
        run: |
          rm -f .github/workflows/finalize_english_mode.yml tools/finalize_english_mode.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py instrument_pdf_reports.py instrument_executive_performance_report.py instrument_v03_user_guide.py .github/workflows/finalize_english_mode.yml tools/finalize_english_mode.py
          git commit -m "Finalize English guide and report center"
          git push origin HEAD:instrument-lifecycle-standalone
